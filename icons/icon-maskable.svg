<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#4a3420"/><stop offset="1" stop-color="#1a120b"/></radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7a6"/><stop offset="1" stop-color="#e3b452"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9a640"/><stop offset="1" stop-color="#9a6a22"/></linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8862f"/><stop offset="1" stop-color="#6e4614"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="#c9a24a" stroke-opacity=".45" stroke-width="6"/>
  <!-- 回紋 corners -->
  <g fill="none" stroke="#c9a24a" stroke-opacity=".55" stroke-width="7" stroke-linecap="square">
    <path d="M58 116V58h58M78 96V78h18"/><path d="M454 116V58h-58M434 96V78h-18"/>
    <path d="M58 396v58h58M78 416v18h18"/><path d="M454 396v58h-58M434 416v18h-18"/>
  </g>
  <!-- isometric bronze cube = 3D model -->
  <g transform="translate(256 262)">
    <path d="M0 -150 L130 -75 L0 0 L-130 -75 Z" fill="url(#top)"/>
    <path d="M-130 -75 L0 0 L0 150 L-130 75 Z" fill="url(#left)"/>
    <path d="M130 -75 L0 0 L0 150 L130 75 Z" fill="url(#right)"/>
    <g fill="none" stroke="#fff3cc" stroke-opacity=".9" stroke-width="5" stroke-linejoin="round">
      <path d="M0 -150 L130 -75 L130 75 L0 150 L-130 75 L-130 -75 Z"/><path d="M-130 -75 L0 0 L130 -75 M0 0 V150"/>
    </g>
    <!-- wireframe hints on the faces -->
    <g stroke="#5a3a14" stroke-opacity=".45" stroke-width="3" fill="none">
      <path d="M-65 -37.5 V112.5 M-130 0 L0 75"/><path d="M65 -37.5 V112.5 M130 0 L0 75"/>
      <path d="M-65 -112.5 L65 -37.5 M65 -112.5 L-65 -37.5"/>
    </g>
  </g>
  <!-- red seal 模 -->
  <g transform="translate(372 372) rotate(-6)">
    <rect x="-52" y="-52" width="104" height="104" rx="14" fill="#b8322a" stroke="#f2d48a" stroke-width="4"/>
    <text x="0" y="24" font-size="70" text-anchor="middle" fill="#fff1d0" font-family="Noto Serif TC,Songti TC,PMingLiU,serif" font-weight="700">模</text>
  </g>
</svg>
