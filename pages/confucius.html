  for (let i = 0; i < 160; i++) setTimeout(() => { const a = rand() * TAU, r = 0.3 + rand() * 1.4; spark(V(Math.cos(a) * r, 2.6 + rand() * 0.6, Math.sin(a) * r), V((rand() - 0.5) * 0.3, -0.35 - rand() * 0.3, (rand() - 0.5) * 0.3), rand() < 0.6 ? PINK : GOLD, 3.5); }, i * 18); }

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hit(e) { ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); const hs = ray.intersectObject(root, true).filter(h => h.object.material !== MAT.halo); return hs[0] ? hs[0].object.userData.part || 'body' : null; }
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { audio(); down = { x: e.clientX, y: e.clientY, part: hit(e) }; });
addEventListener('pointerup', (e) => { if (down && down.part && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 8) { ({ head: nod, hands: bow, body: bow }[down.part] || bow)(); } down = null; });
document.getElementById('bBow').onclick = () => { audio(); bow(); };
document.getElementById('bTeach').onclick = () => { audio(); teach(); };
document.getElementById('bAwake').onclick = () => { audio(); bows = 0; awaken(); };
const bSpin = document.getElementById('bSpin'); bSpin.onclick = () => { controls.autoRotate = !controls.autoRotate; controls.autoRotateSpeed = 1.0; bSpin.classList.toggle('on', controls.autoRotate); };
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => { palette = b.dataset.m; awakened = 0; document.querySelectorAll('#modes button').forEach(x => x.classList.toggle('on', x === b)); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ===== GLB =====
function buildClips() {
  const FPS = 15;
  function bake(name, dur, stFn) { const n = Math.round(dur * FPS), tracks = {};
    for (let i = 0; i <= n; i++) { const t = i / FPS, st = Object.assign({}, REST, { t }, stFn(t / dur));
      for (const [node, tr] of computePose(st)) for (const key of ['p', 'q', 's']) if (tr[key]) { const id = node + key; (tracks[id] ||= { node, key, times: [], vals: [] }); tracks[id].times.push(t); tracks[id].vals.push(...tr[key].toArray()); } }
    const out = []; for (const tr of Object.values(tracks)) { const w = tr.key === 'q' ? 4 : 3, v = tr.vals; let varies = false; for (let i = w; i < v.length && !varies; i++) if (Math.abs(v[i] - v[i % w]) > 1e-4) varies = true; if (!varies) continue;
      out.push(tr.key === 'q' ? new THREE.QuaternionKeyframeTrack(tr.node + '.quaternion', tr.times, v) : new THREE.VectorKeyframeTrack(tr.node + (tr.key === 'p' ? '.position' : '.scale'), tr.times, v)); }
    return new THREE.AnimationClip(name, dur, out); }
  // Idle loops seamlessly over 2π/0.3 ≈ 20.9 s? keep it short: breathing only (period matched)
  const idleDur = TAU / 1.1 * 2;
  return [bake('Idle', idleDur, (k) => ({ look: Math.sin(k * TAU) * 0.12 })), bake('Bow', ...CLIPS.bow), bake('Nod', ...CLIPS.nod), bake('Teach', ...CLIPS.teach), bake('Awaken', ...CLIPS.awake)];
}
function buildExportScene() { setPalette('painted'); const clone = root.clone(true); applyPose(nodeMapOf(clone), REST);
  clone.traverse(o => { if (o.isMesh) { delete o.userData.part; } });
  const s = new THREE.Scene(); s.add(clone); return s; }
function exportGLB() { return new Promise((res, rej) => new GLTFExporter().parse(buildExportScene(), res, rej, { binary: true, maxTextureSize: 1024, animations: buildClips() })); }
window.__exportGLB = async () => { const u = new Uint8Array(await exportGLB()); let bin = ''; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(bin); };
window.__do = (n) => ({ bow, nod, teach, awaken })[n](); window.__pal = (p) => { palette = p; };
window.__cam = (x, y, z, tx, ty, tz) => { camera.position.set(x, y, z); controls.target.set(tx, ty, tz); };
window.__pose = (o) => { window.__fixed = o; };
let dl = null; try { if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { dl = d; }).catch(() => {}); } catch (e) {}
document.getElementById('bExport').onclick = async () => { showQuote('正在產生模型…', '匯出');
  try { const buf = await exportGLB();
    if (dl) { const zip = zipSync({ 'confucius.glb': [new Uint8Array(buf), { level: 0 }] }); try { await dl.save({ filename: 'confucius-glb.zip', data: zip }); showQuote('已下載 confucius-glb.zip', '解壓後即是 confucius.glb'); } catch (e) { showQuote(e && e.code === 'declined' ? '已取消下載' : '這裡無法下載', '匯出'); } }
    else if (window.claude) showQuote('此預覽畫面不支援下載', '匯出');
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' })); a.download = 'confucius.glb'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); showQuote('已下載 confucius.glb', '匯出'); }
  } catch (e) { showQuote('匯出失敗：' + e.message, '匯出'); } };

// ===== loop =====
document.getElementById('loading').remove();
const clock = new THREE.Clock();
const wp = (n) => live[n].getWorldPosition(V(0, 0, 0));
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  Object.assign(S, REST, { t }); S.look = Math.sin(t * 0.3) * 0.12;
  for (let i = acts.length - 1; i >= 0; i--) { const a = acts[i]; a.t += dt; const k = Math.min(1, a.t / a.dur); a.fn(k, S); if (k >= 1) { acts.splice(i, 1); if (a.end) a.end(); } }
  if (window.__fixed) Object.assign(S, window.__fixed);
  awakeK += ((awakened ? 1 : 0) - awakeK) * Math.min(1, dt * 1.2);
  if (awakened) S.halo = Math.max(S.halo, awakeK);
  applyPose(live, S);
  setPalette(palette, 'awake', awakeK);
  glow = Math.max(0, glow - dt * 0.8); MAT.trim.emissiveIntensity = 0.6 + glow * 0.5 + awakeK * 0.4 + Math.sin(t * 2) * 0.1 * awakeK; glowLight.intensity = glow * 1.5 + awakeK * 1.2;
  if (awakeK > 0.3 && rand() < 0.5) { const a = rand() * TAU; spark(wp('Halo').add(V(Math.cos(a) * 0.3, Math.sin(a) * 0.3, 0)), V(0, 0.15, 0.05), GOLD, 1.5); }
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.t += dt; r.m.scale.setScalar(0.5 + r.t * 1.6); r.m.material.opacity = Math.max(0, 0.85 * (1 - r.t / 1.6)); if (r.t > 1.6) { scene.remove(r.m); r.m.material.dispose(); rings.splice(i, 1); } }
  for (let i = 0; i < SPARK_N; i++) { const s = sparks[i]; if (s.life > 0) { s.life -= dt; sparkPos[i * 3] += s.v.x * dt; sparkPos[i * 3 + 1] += s.v.y * dt; sparkPos[i * 3 + 2] += s.v.z * dt; const f = Math.max(0, s.life / s.max); sparkCol[i * 3] = s.c[0] * f; sparkCol[i * 3 + 1] = s.c[1] * f; sparkCol[i * 3 + 2] = s.c[2] * f; } else sparkCol[i * 3] = sparkCol[i * 3 + 1] = sparkCol[i * 3 + 2] = 0; }
  sparkGeo.attributes.position.needsUpdate = sparkGeo.attributes.color.needsUpdate = true;
  controls.update(); renderer.render(scene, camera);
}
animate();
