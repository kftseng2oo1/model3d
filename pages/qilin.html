import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x14120c); scene.fog = new THREE.Fog(0x14120c, 12, 28);

const rand = (() => { let s = 67; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

// ===== environment =====
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: 0x2a2418, roughness: 0.7, metalness: 0.15 }));

for (const r of [1.6, 3.4]) { const m = new THREE.Mesh(new THREE.RingGeometry(r, r + 0.07, 96), new THREE.MeshBasicMaterial({ color: 0x8a7a4a })); m.rotation.x = -Math.PI / 2; m.position.y = 0.005; scene.add(m); }

const DOT = dotTex();
{ const N = 300, g = new THREE.BufferGeometry(), a = new Float32Array(N * 3); for (let i = 0; i < N; i++) { const t = rand() * TAU, r = 3 + rand() * 10; a.set([Math.cos(t) * r, rand() * 7, Math.sin(t) * r], i * 3); }

// ===== textures =====
function scaleField(S, G) {
  const cell = S / G, pts = [];
  for (let i = 0; i < G * G; i++) pts.push([0.15 + rand() * 0.7, 0.15 + rand() * 0.7, rand()]);
  const edge = new Float32Array(S * S), tone = new Float32Array(S * S), dy = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const cx = Math.floor(x / cell), cy = Math.floor(y / cell); let d1 = 1e9, d2 = 1e9, id = 0, py = 0;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      const gx = cx + ox, gy = cy + oy, p = pts[((gy + G) % G) * G + ((gx + G) % G)], qy = (gy + p[1]) * cell, d = Math.hypot(x - (gx + p[0]) * cell, (y - qy) * 1.35);
      if (d < d1) { d2 = d1; d1 = d; id = p[2]; py = (y - qy) / cell; } else if (d < d2) d2 = d; }

  }

}
function scaleTextures() {   // jade-teal scales with gold rims, cream underside toward v=0
  const S = 512, { edge, tone, dy } = scaleField(S, 30);
  const dark = [18, 104, 96], light = [96, 214, 196], rim = [246, 214, 120], belly = [240, 228, 196];
  const map = canvasTex(S, S, (ctx) => { const img = ctx.createImageData(S, S), d = img.data;
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { const i = y * S + x, e = smooth(0, 0.3, edge[i]), t = tone[i] * 0.45 + smooth(-0.5, 0.5, dy[i]) * 0.55, n = rand() * 8, b = smooth(0.72, 0.9, y / S);
      for (let k = 0; k < 3; k++) { const base = mix(mix(dark[k], light[k], t), belly[k], b); d[i * 4 + k] = mix(rim[k], base, e) + n; } d[i * 4 + 3] = 255; }

maneMat.emissiveMap = maneMat.map;

// ===== helpers =====
const wispGeoCache = new Map();
function wispGeo(len, wid) { const k = len.toFixed(2) + '_' + wid.toFixed(2); if (wispGeoCache.has(k)) return wispGeoCache.get(k);
  const sh = new THREE.Shape(), N = 20, hw = (v) => wid * 0.5 * Math.sin(Math.PI * Math.pow(Math.min(0.999, v), 0.6)) * Math.pow(1 - v, 0.25), wv = (v) => Math.sin(v * 7) * wid * 0.25 * v;

{ const b = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 1.9), [stoneMat, stoneMat, stoneTop, stoneMat, stoneMat, stoneMat]); b.position.y = 0.25; b.castShadow = b.receiveShadow = true; altar.add(b);

// bronze collar with jade beads and a medallion
{ const col = new THREE.Group(); col.position.set(0, 0.12, 0.12); col.rotation.x = -0.9; chest.add(col);

const LEGS = {};

    if (dl) { const zip = zipSync({ 'qilin.glb': [new Uint8Array(buf), { level: 0 }] }); try { await dl.save({ filename: 'qilin-glb.zip', data: zip }); toast('已下載 qilin-glb.zip，解壓後即是 qilin.glb', true); } catch (e) { toast(e && e.code === 'declined' ? '已取消下載' : '這裡無法下載：' + (e && e.code || ''), true); } }

const clock = new THREE.Clock();

  controls.update(); renderer.render(scene, camera);
}
