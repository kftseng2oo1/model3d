<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { zipSync } from 'fflate';

// ================= renderer / scene =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x071420);
scene.fog = new THREE.Fog(0x071420, 12, 28);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 80);
camera.position.set(3.0, 2.8, 8.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.8, 0);
controls.enableDamping = true; controls.minDistance = 2.5; controls.maxDistance = 16; controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x0a1a20, 0.9));
const key = new THREE.DirectionalLight(0xf0f8ff, 2.2); key.position.set(3, 8, 5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 0.5, far: 25 });
key.shadow.bias = -0.0005; key.shadow.normalBias = 0.02; scene.add(key);
const rimL = new THREE.DirectionalLight(0x7fd8ff, 1.0); rimL.position.set(-4, 3, -4); scene.add(rimL);
const warmL = new THREE.DirectionalLight(0xffd9a0, 0.5); warmL.position.set(4, 1, 2); scene.add(warmL);
const glowLight = new THREE.PointLight(0x5ff0d8, 0, 8, 1.6); glowLight.position.set(0, 2, 0.5); scene.add(glowLight);

// ================= helpers =================
const rand = (() => { let s = 37; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function canvasTex(w, h, fn, color = true, mime = 'image/jpeg') {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (color) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); t.userData.mimeType = mime; return t;
}
function pixelTex(w, h, fn, color = true) { return canvasTex(w, h, (ctx) => { const img = ctx.createImageData(w, h); fn(img.data, w, h); ctx.putImageData(img, 0, 0); }, color); }
function heightToNormal(hArr, w, h, strength) {
  const at = (x, y) => hArr[((y + h) % h) * w + ((x + w) % w)];
  return pixelTex(w, h, (d) => { for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const nx = -(at(x + 1, y) - at(x - 1, y)) * strength, ny = -(at(x, y - 1) - at(x, y + 1)) * strength, l = Math.hypot(nx, ny, 1), i = (y * w + x) * 4;
    d[i] = (nx / l * 0.5 + 0.5) * 255; d[i + 1] = (ny / l * 0.5 + 0.5) * 255; d[i + 2] = (1 / l * 0.5 + 0.5) * 255; d[i + 3] = 255; } }, false);
}

// ================= environment =================
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: 0x10262c, roughness: 0.6, metalness: 0.2 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
for (const r of [1.7, 3.2]) { const m = new THREE.Mesh(new THREE.RingGeometry(r, r + 0.08, 96), new THREE.MeshBasicMaterial({ color: 0x2a8a7a })); m.rotation.x = -Math.PI / 2; m.position.y = 0.005; scene.add(m); }
function dotTex() { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,255,255,.4)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); }
const DOT = dotTex();
{ const N = 260, g = new THREE.BufferGeometry(), a = new Float32Array(N * 3); for (let i = 0; i < N; i++) { const t = rand() * TAU, r = 3 + rand() * 9; a.set([Math.cos(t) * r, rand() * 6, Math.sin(t) * r], i * 3); }
  g.setAttribute('position', new THREE.BufferAttribute(a, 3)); scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.05, map: DOT, color: 0x9fd8ff, transparent: true, opacity: 0.6, depthWrite: false, blending: THREE.AdditiveBlending }))); }

// ================= textures =================
function scaleField(S, G) {
  const cell = S / G, pts = [];
  for (let i = 0; i < G * G; i++) pts.push([0.15 + rand() * 0.7, 0.15 + rand() * 0.7, rand()]);
  const edge = new Float32Array(S * S), tone = new Float32Array(S * S), dy = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const cx = Math.floor(x / cell), cy = Math.floor(y / cell); let d1 = 1e9, d2 = 1e9, id = 0, py = 0;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      const gx = cx + ox, gy = cy + oy, p = pts[((gy + G) % G) * G + ((gx + G) % G)], qy = (gy + p[1]) * cell, d = Math.hypot(x - (gx + p[0]) * cell, (y - qy) * 1.35);
      if (d < d1) { d2 = d1; d1 = d; id = p[2]; py = (y - qy) / cell; } else if (d < d2) d2 = d; }
    edge[y * S + x] = Math.min(1, (d2 - d1) / (cell * 0.32)); tone[y * S + x] = id; dy[y * S + x] = py;
  }
  return { edge, tone, dy };
}
function swirl(g, x, y, r, w) { g.lineWidth = w; g.beginPath(); for (let a = 0; a < 9; a += 0.15) { const rr = r * (1 - a / 10); g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.stroke(); }
function scaleTextures() {   // emerald scales, gold rims, golden cloud-swirl filigree
  const S = 512, { edge, tone, dy } = scaleField(S, 18);
  const dark = [8, 78, 62], light = [52, 200, 150], rim = [238, 206, 120];
  const swirls = []; for (let i = 0; i < 7; i++) swirls.push([rand() * S, rand() * S, 22 + rand() * 18]);
  const paintSwirls = (ctx, em) => { ctx.strokeStyle = em ? '#c89a30' : '#f2cc68'; for (const [x, y, r] of swirls) for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) swirl(ctx, x + ox, y + oy, r, 3); };
  const map = canvasTex(S, S, (ctx) => {
    const img = ctx.createImageData(S, S), d = img.data;
    for (let i = 0; i < S * S; i++) { const e = smooth(0, 0.28, edge[i]), t = tone[i] * 0.5 + smooth(-0.5, 0.5, dy[i]) * 0.5, n = rand() * 8;
      for (let k = 0; k < 3; k++) d[i * 4 + k] = mix(rim[k], mix(dark[k], light[k], t), e) + n; d[i * 4 + 3] = 255; }
    ctx.putImageData(img, 0, 0); paintSwirls(ctx, false);
  });
  const em = canvasTex(S, S, (ctx) => {
    const img = ctx.createImageData(S, S), d = img.data;
    for (let i = 0; i < S * S; i++) { const g = 1 - smooth(0, 0.28, edge[i]); d[i * 4] = 60 * g; d[i * 4 + 1] = 230 * g; d[i * 4 + 2] = 200 * g; d[i * 4 + 3] = 255; }
    ctx.putImageData(img, 0, 0); paintSwirls(ctx, true);
  });
  const hgt = new Float32Array(S * S); for (let i = 0; i < S * S; i++) hgt[i] = Math.sqrt(edge[i]) * (0.55 + 0.45 * smooth(-0.5, 0.5, dy[i]));
  const normal = heightToNormal(hgt, S, S, 2.4);
  for (const t of [map, normal, em]) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return { map, normal, emissive: em };
}
function bellyTextures() {   // ivory ventral plates with gold seams
  const W = 128, H = 256;
  const draw = (em) => (g) => {
    if (!em) { const gr = g.createLinearGradient(0, 0, W, 0); gr.addColorStop(0, '#9fc8b4'); gr.addColorStop(0.5, '#f1ecd2'); gr.addColorStop(1, '#9fc8b4'); g.fillStyle = gr; } else g.fillStyle = '#000';
    g.fillRect(0, 0, W, H);
    g.strokeStyle = em ? '#806020' : '#c9a24a'; g.lineWidth = 3;
    for (let y = 0; y <= H; y += 32) { g.beginPath(); g.moveTo(0, y); g.quadraticCurveTo(W / 2, y + 10, W, y); g.stroke(); }
  };
  const map = canvasTex(W, H, draw(false)), emissive = canvasTex(W, H, draw(true));
  map.wrapS = map.wrapT = emissive.wrapS = emissive.wrapT = THREE.RepeatWrapping;
  return { map, emissive };
}
function wispTexture() {
  const t = canvasTex(128, 256, (g, W, H) => { g.clearRect(0, 0, W, H);
    for (let k = 0; k < 3; k++) { const gr = g.createRadialGradient(W / 2, H * 0.78, 4, W / 2, H * 0.6, H * 0.62);
      gr.addColorStop(0, 'rgba(200,255,255,1)'); gr.addColorStop(0.25, 'rgba(90,230,250,.95)'); gr.addColorStop(0.55, 'rgba(40,150,255,.85)'); gr.addColorStop(0.85, 'rgba(60,90,230,.35)'); gr.addColorStop(1, 'rgba(40,40,200,0)');
      g.fillStyle = gr; g.fillRect(0, 0, W, H); } }, true, 'image/png');
  return t;
}
function pearlTextures() {
  const S = 256;
  const draw = (em) => (g) => { const gr = g.createRadialGradient(S / 2, S / 2, 4, S / 2, S / 2, S / 2); gr.addColorStop(0, em ? '#ffffff' : '#f2ffff'); gr.addColorStop(0.6, em ? '#4ad8ff' : '#9fe8ff'); gr.addColorStop(1, em ? '#1040c0' : '#3a7ae0'); g.fillStyle = gr; g.fillRect(0, 0, S, S);
    g.strokeStyle = em ? '#ffffff' : '#e8ffff'; for (let k = 0; k < 4; k++) swirl(g, S / 2 + Math.cos(k * 1.6) * 40, S / 2 + Math.sin(k * 1.6) * 40, 60, 4); };
  return { map: canvasTex(S, S, draw(false)), emissive: canvasTex(S, S, draw(true)) };
}
function jadeTex() {
  return pixelTex(256, 256, (d, W, H) => { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const n = (Math.sin(x * 0.05 + Math.sin(y * 0.08) * 2) + Math.sin((x + y) * 0.03)) * 0.25 + rand() * 0.1, i = (y * W + x) * 4;
    const band = (y % 64 < 3) ? 1 : 0; d[i] = mix(30 + n * 40, 214, band); d[i + 1] = mix(110 + n * 60, 172, band); d[i + 2] = mix(100 + n * 50, 80, band); d[i + 3] = 255; } });
}

// ================= materials =================
const SC = scaleTextures(), BL = bellyTextures(), WISP = wispTexture(), PE = pearlTextures();
const glowMats = [];
function glowable(m, base) { m.userData.baseEmissive = base; glowMats.push(m); return m; }
function scaleMat(rx, ry) {
  const m = SC.map.clone(), n = SC.normal.clone(), e = SC.emissive.clone();
  for (const t of [m, n, e]) { t.repeat.set(rx, ry); t.needsUpdate = true; }
  const mat = glowable(new THREE.MeshStandardMaterial({ name: 'scales', map: m, normalMap: n, emissiveMap: e, emissive: 0xffffff, emissiveIntensity: 0.7, roughness: 0.32, metalness: 0.25 }), 0.7);
  mat.userData.tex = SC; return mat;
}
const bodyMat = scaleMat(2, 1);
const bellyMat = glowable(new THREE.MeshStandardMaterial({ name: 'belly', map: BL.map, emissiveMap: BL.emissive, emissive: 0xffffff, emissiveIntensity: 0.4, roughness: 0.4, metalness: 0.1 }), 0.4);
const wispMat = glowable(new THREE.MeshStandardMaterial({ name: 'wisp', color: 0xbff8ff, map: WISP, emissiveMap: WISP, emissive: 0x7fe8ff, emissiveIntensity: 0.8, transparent: true, depthWrite: false, side: THREE.DoubleSide, roughness: 1, metalness: 0 }), 0.8);
const goldMat = new THREE.MeshStandardMaterial({ name: 'gold', color: 0xe8c060, roughness: 0.25, metalness: 0.75, emissive: 0x3a2800, emissiveIntensity: 1 });
const clawMat = new THREE.MeshStandardMaterial({ name: 'claw', color: 0xf0e6c8, roughness: 0.3, metalness: 0.3 });
const eyeMat = glowable(new THREE.MeshStandardMaterial({ name: 'dragon_eye', color: 0xe8ffff, emissive: 0x7ff8ff, emissiveIntensity: 1.2, roughness: 0.1 }), 1.2);
const pupilMat = new THREE.MeshStandardMaterial({ name: 'pupil', color: 0x061018, roughness: 0.1 });
const mouthMat = new THREE.MeshStandardMaterial({ name: 'mouth', color: 0xa0202a, roughness: 0.6 });
const pearlMat = glowable(new THREE.MeshStandardMaterial({ name: 'pearl', map: PE.map, emissiveMap: PE.emissive, emissive: 0xffffff, emissiveIntensity: 1.2, roughness: 0.15, metalness: 0.1 }), 1.2);
const jadeMap = jadeTex(); jadeMap.wrapS = jadeMap.wrapT = THREE.RepeatWrapping;
const jadeMat = new THREE.MeshStandardMaterial({ name: 'jade', map: jadeMap, roughness: 0.3, metalness: 0.2 });
const cloudMat = glowable(new THREE.MeshStandardMaterial({ name: 'cloud', color: 0xdff6ff, emissive: 0x6fb8d8, emissiveIntensity: 0.35, roughness: 0.9, transparent: true, opacity: 0.92 }), 0.35);

// ================= geometry helpers =================
const wispGeoCache = new Map();
function wispGeo(len, wid) {
  const k = len.toFixed(2) + '_' + wid.toFixed(2); if (wispGeoCache.has(k)) return wispGeoCache.get(k);
  const sh = new THREE.Shape(), N = 20, hw = (v) => wid * 0.5 * Math.sin(Math.PI * Math.pow(Math.min(0.999, v), 0.6)) * Math.pow(1 - v, 0.25), wv = (v) => Math.sin(v * 7) * wid * 0.25 * v;
  sh.moveTo(0, 0); for (let i = 1; i <= N; i++) { const v = i / N; sh.lineTo(hw(v) + wv(v), v * len); } for (let i = N - 1; i >= 1; i--) { const v = i / N; sh.lineTo(-hw(v) + wv(v), v * len); }
  const g = new THREE.ShapeGeometry(sh, 2), p = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) / wid + 0.5, 0.15 + 0.8 * (p.getY(i) / len));
  g.rotateX(-Math.PI / 2); wispGeoCache.set(k, g); return g;   // length along -z
}
function addWisp(parent, x, y, z, len, wid, yaw, pitch, roll = 0) {
  const m = new THREE.Mesh(wispGeo(len, wid), wispMat); m.position.set(x, y, z); m.rotation.order = 'YXZ'; m.rotation.set(pitch, yaw, roll); m.renderOrder = 2; parent.add(m);
  const m2 = m.clone(); m2.rotation.z = roll + Math.PI / 2; parent.add(m2); return m;
}
function tube(points, r0, r1, mat, seg = 24) {   // tapered tube
  const c = new THREE.CatmullRomCurve3(points), g = new THREE.TubeGeometry(c, seg, 1, 8, false), p = g.attributes.position;
  const fr = c.computeFrenetFrames(seg, false);
  for (let i = 0; i <= seg; i++) { const ctr = c.getPointAt(i / seg), r = mix(r0, r1, i / seg); for (let j = 0; j <= 8; j++) { const k = i * 9 + j; const v = V(p.getX(k), p.getY(k), p.getZ(k)).sub(ctr).multiplyScalar(r).add(ctr); p.setXYZ(k, v.x, v.y, v.z); } }
  g.computeVertexNormals(); return new THREE.Mesh(g, mat);
}

// ================= build =================
const root = new THREE.Group(); root.name = 'Qinglong'; scene.add(root);
function tagPart(obj, part) { obj.traverse(o => { o.userData.part = part; }); }

// --- auspicious cloud altar ---
const altar = new THREE.Group(); altar.name = 'Altar'; root.add(altar);
{
  const a = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 1.05, 0.28, 56), jadeMat); a.position.y = 0.14; a.castShadow = a.receiveShadow = true; altar.add(a);
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.78, 0.86, 0.12, 56), jadeMat); b.position.y = 0.34; b.receiveShadow = true; altar.add(b);
  for (const [r, y] of [[1.05, 0.01], [0.9, 0.28], [0.78, 0.4]]) { const t = new THREE.Mesh(new THREE.TorusGeometry(r, 0.02, 8, 72), goldMat); t.rotation.x = Math.PI / 2; t.position.y = y; altar.add(t); }
}
const CLOUDS = [];
for (let i = 0; i < 9; i++) {
  const a = (i / 9) * TAU + 0.2, c = new THREE.Group(); c.name = 'Cloud_' + i;
  for (let k = 0; k < 4; k++) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.16 + rand() * 0.1, 18, 12), cloudMat); m.position.set((rand() - 0.5) * 0.3, rand() * 0.12, (rand() - 0.5) * 0.3); m.scale.y = 0.65; c.add(m); }
  c.position.set(Math.cos(a) * 0.72, 0.46, Math.sin(a) * 0.72); c.userData = { a, ph: rand() * TAU, n: 2 + (i % 3) };
  altar.add(c); CLOUDS.push(c);
}
tagPart(altar, 'cloud');

};
function play(name, end) { const [d, fn] = CLIPS[name]; return act(name, d, (k, st) => Object.assign(st, fn(k)), end); }
const headPos = () => live.Head.getWorldPosition(V(0, 0, 0));
function onHead() { if (play('roar')) { roarSound(); glow = Math.max(glow, 1.4); } }
function onBody() { if (play('wave')) { swimSound(); for (let i = 0; i < 40; i++) { const sg = segs[Math.floor(rand() * N)].getWorldPosition(V(0, 0, 0)); spark(sg, V((rand() - 0.5) * 0.4, 0.3 + rand() * 0.4, (rand() - 0.5) * 0.4), rand() < 0.6 ? CYAN : GOLD, 1.2); } } }
function onPearl() { if (play('pearl')) { pearlChime(); glow = Math.max(glow, 1.6); const p = live.Pearl.getWorldPosition(V(0, 0, 0)); for (let i = 0; i < 40; i++) spark(p, V((rand() - 0.5) * 1.2, (rand() - 0.5) * 1.2, (rand() - 0.5) * 1.2), rand() < 0.5 ? BLUE : CYAN, 1.0); } }
function onCloud() { if (play('cloud')) { cloudSound(); ring(0x5ff0d8); setTimeout(() => ring(0xbff8ff), 250); for (let i = 0; i < 60; i++) { const a = rand() * TAU, r = 0.7 + rand() * 0.4; spark(V(Math.cos(a) * r, 0.5, Math.sin(a) * r), V(Math.cos(a) * 0.4, 0.8 + rand() * 0.8, Math.sin(a) * 0.4), rand() < 0.6 ? CYAN : BLUE, 1.6); } } }
function fly() { if (busy()) return; play('fly'); swimSound(); }
function awaken() {
  if (busy()) return; affection = 0; jueChord(); roarSound(); thunder(); toast('青龍護佑・東方甲木');
  for (let k = 0; k < 6; k++) setTimeout(() => ring(k % 2 ? 0xbff8ff : 0x3fd8b8), k * 220);
  play('awake', () => { play('fly'); swimSound(); });
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hit(e) { ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); const h = ray.intersectObject(root, true).find(x => x.object.material !== wispMat) || ray.intersectObject(root, true)[0]; return h ? { part: h.object.userData.part, point: h.point } : null; }
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { audio(); const h = hit(e); if (h) { controls.enabled = false; down = { lx: e.clientX, ly: e.clientY, part: h.part, point: h.point, moved: 0 }; } });
addEventListener('pointermove', (e) => {
  if (!down) return; const d = Math.hypot(e.clientX - down.lx, e.clientY - down.ly); down.lx = e.clientX; down.ly = e.clientY; down.moved += d;
  if (down.moved > 10) { const h = hit(e); if (h) { affection = Math.min(1, affection + d / 2600); happyT = 0.6; glow = Math.max(glow, 0.8); petStroke += d;
    if (rand() < 0.5) spark(h.point, V((rand() - 0.5) * 0.3, 0.3 + rand() * 0.4, (rand() - 0.5) * 0.3), rand() < 0.5 ? CYAN : GOLD, 1);
    if (petStroke > 380) { petStroke = 0; tone([659, 740, 831, 988, 1109][Math.floor(rand() * 5)], 0.6, 0.05); }
    if (affection >= 1) awaken(); } }
});
addEventListener('pointerup', () => {
  if (down && down.moved < 10 && !busy()) { hintEl.style.opacity = 0; ({ head: onHead, body: onBody, pearl: onPearl, claw: onBody, cloud: onCloud }[down.part] || onBody)(); affection = Math.min(1, affection + 0.06); if (affection >= 1) awaken(); }
  down = null; controls.enabled = true;
});
document.getElementById('bFly').onclick = () => { audio(); fly(); };
document.getElementById('bAwake').onclick = () => { audio(); awaken(); };
const bSpin = document.getElementById('bSpin');
bSpin.onclick = () => { controls.autoRotate = !controls.autoRotate; controls.autoRotateSpeed = 1.0; bSpin.classList.toggle('on', controls.autoRotate); };
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ================= GLB clips & export =================
function buildClips() {
  const FPS = 12;
  function bake(name, dur, stFn) {
    const n = Math.round(dur * FPS), tracks = {};
    for (let i = 0; i <= n; i++) { const t = i / FPS, st = Object.assign({}, REST, { t }, stFn(t / dur, t));
      for (const [node, tr] of computePose(st)) for (const key of ['p', 'q', 's']) if (tr[key]) { const id = node + key; (tracks[id] ||= { node, key, times: [], vals: [] }); tracks[id].times.push(t); tracks[id].vals.push(...tr[key].toArray()); } }
    const out = [];
    for (const tr of Object.values(tracks)) { const w = tr.key === 'q' ? 4 : 3, v = tr.vals; let varies = false; for (let i = w; i < v.length && !varies; i++) if (Math.abs(v[i] - v[i % w]) > 1e-4) varies = true; if (!varies) continue;
      out.push(tr.key === 'q' ? new THREE.QuaternionKeyframeTrack(tr.node + '.quaternion', tr.times, v) : new THREE.VectorKeyframeTrack(tr.node + (tr.key === 'p' ? '.position' : '.scale'), tr.times, v)); }
    return new THREE.AnimationClip(name, dur, out);
  }
  return [
    bake('Idle', 6, () => ({})),
    bake('Roar', CLIPS.roar[0], CLIPS.roar[1]),
    bake('Undulate', CLIPS.wave[0], CLIPS.wave[1]),
    bake('Pearl', CLIPS.pearl[0], CLIPS.pearl[1]),
    bake('Cloud', CLIPS.cloud[0], CLIPS.cloud[1]),
    bake('Fly', CLIPS.fly[0], CLIPS.fly[1]),
    bake('Awaken', CLIPS.awake[0], CLIPS.awake[1]),
  ];
}
function buildExportScene() {
  const clone = root.clone(true); applyPose(nodeMapOf(clone), REST);
  const geoCache = new Map(), matCache = new Map();
  clone.traverse(o => { if (!o.isMesh) return; const m0 = o.material;
    if (m0.userData.tex) { const rep = m0.map.repeat, k = o.geometry.uuid + rep.x + 'x' + rep.y;
      if (!geoCache.has(k)) { const g = o.geometry.clone(), uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * rep.x, uv.getY(i) * rep.y); geoCache.set(k, g); }
      o.geometry = geoCache.get(k);
      if (!matCache.has('scales')) { const m = m0.clone(); m.map = SC.map; m.normalMap = SC.normal; m.emissiveMap = SC.emissive; m.emissiveIntensity = 0.7; m.name = 'scales'; matCache.set('scales', m); }
      o.material = matCache.get('scales');
    } else if (m0.userData.baseEmissive !== undefined) { if (!matCache.has(m0.uuid)) { const m = m0.clone(); m.emissiveIntensity = m0.userData.baseEmissive; matCache.set(m0.uuid, m); } o.material = matCache.get(m0.uuid); } });
  const s = new THREE.Scene(); s.add(clone); return s;
}
function exportGLB() { return new Promise((res, rej) => new GLTFExporter().parse(buildExportScene(), res, rej, { binary: true, maxTextureSize: 1024, animations: buildClips() })); }
window.__exportGLB = async () => { const u = new Uint8Array(await exportGLB()); let bin = ''; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(bin); };
window.__tap = (p) => ({ head: onHead, body: onBody, pearl: onPearl, cloud: onCloud })[p]();
window.__awaken = awaken; window.__fly = fly;
let dl = null;
try { if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { dl = d; }).catch(() => {}); } catch (e) {}
document.getElementById('bExport').onclick = async () => {
  toast('正在產生模型…', true);
  try { const buf = await exportGLB();
    if (dl) { const zip = zipSync({ 'dragon.glb': [new Uint8Array(buf), { level: 0 }] });
      try { await dl.save({ filename: 'dragon-glb.zip', data: zip }); toast('已下載 dragon-glb.zip，解壓後即是 dragon.glb', true); } catch (e) { toast(e && e.code === 'declined' ? '已取消下載' : '這裡無法下載：' + (e && e.code || ''), true); } }
    else if (window.claude) toast('此預覽畫面不支援下載', true);
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' })); a.download = 'dragon.glb'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast('已下載 dragon.glb', true); }
  } catch (e) { toast('匯出失敗：' + e.message, true); }
};

// ================= loop =================
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  Object.assign(S, REST, { t });
  S.look = Math.sin(t * 0.4) * 0.2;
  for (let i = acts.length - 1; i >= 0; i--) { const a = acts[i]; a.t += dt; const k = Math.min(1, a.t / a.dur); a.fn(k, S); if (k >= 1) { acts.splice(i, 1); if (a.end) a.end(); } }
  if (happyT > 0) { S.mane = Math.max(S.mane, 0.4); happyT -= dt; }
  applyPose(live, S);
  glow = Math.max(0, glow - dt * 1.3);
  const g = glow + S.awake * 2.5 + S.pearl;
  for (const m of glowMats) m.emissiveIntensity = m.userData.baseEmissive * (1 + Math.min(g, 2.5) * (m === wispMat ? 0.35 : 0.8));
  glowLight.intensity = g * 3; glowLight.position.copy(headPos()).add(V(0, -0.3, 0.3));
  if (S.awake > 0.3 && rand() < 0.25) { const a = segs[Math.floor(rand() * N)].getWorldPosition(V(0, 0, 0)); bolt(a, a.clone().add(V((rand() - 0.5) * 0.9, (rand() - 0.5) * 0.9, (rand() - 0.5) * 0.9))); }
  if (rand() < 0.15 + S.awake) { const a = segs[Math.floor(rand() * N)].getWorldPosition(V(0, 0, 0)); spark(a, V((rand() - 0.5) * 0.2, 0.2 + rand() * 0.3, (rand() - 0.5) * 0.2), rand() < 0.7 ? CYAN : GOLD, 1.2); }
  if (S.fly > 0.05 && S.fly < 0.95 && rand() < 0.8) spark(segs[N - 1].getWorldPosition(V(0, 0, 0)), V(0, 0, 0), CYAN, 1.3);
  affection = Math.max(0, affection - dt * 0.01); fill.style.width = (affection * 100).toFixed(1) + '%';
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.t += dt; r.m.scale.setScalar(0.8 + r.t * 2.6); r.m.material.opacity = Math.max(0, 0.8 * (1 - r.t / 1.6)); if (r.t > 1.6) { scene.remove(r.m); r.m.material.dispose(); rings.splice(i, 1); } }
  for (let i = bolts.length - 1; i >= 0; i--) { const b = bolts[i]; b.t += dt; b.l.material.opacity = Math.max(0, 1 - b.t / 0.25); if (b.t > 0.25) { scene.remove(b.l); b.l.geometry.dispose(); b.l.material.dispose(); bolts.splice(i, 1); } }
  for (let i = 0; i < SPARK_N; i++) { const s = sparks[i]; if (s.life > 0) { s.life -= dt; s.v.y += s.g * dt; sparkPos[i * 3] += s.v.x * dt; sparkPos[i * 3 + 1] += s.v.y * dt; sparkPos[i * 3 + 2] += s.v.z * dt; const f = Math.max(0, s.life / s.max); sparkCol[i * 3] = s.c[0] * f; sparkCol[i * 3 + 1] = s.c[1] * f; sparkCol[i * 3 + 2] = s.c[2] * f; } else sparkCol[i * 3] = sparkCol[i * 3 + 1] = sparkCol[i * 3 + 2] = 0; }
  sparkGeo.attributes.position.needsUpdate = sparkGeo.attributes.color.needsUpdate = true;
  controls.update(); renderer.render(scene, camera);
}
animate();
</script>
