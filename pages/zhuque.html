<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { zipSync } from 'fflate';

// ================= renderer / scene =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a0a08);
scene.fog = new THREE.Fog(0x1a0a08, 10, 24);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 80);
camera.position.set(2.2, 2.3, 6.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.35, 0);
controls.enableDamping = true;
controls.minDistance = 2.2; controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xffe2c0, 0x2a0e08, 0.8));
const key = new THREE.DirectionalLight(0xfff0dc, 2.2);
key.position.set(3, 7, 4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 0.5, far: 25 });
key.shadow.bias = -0.0005; key.shadow.normalBias = 0.02;
scene.add(key);
const rimL = new THREE.DirectionalLight(0xffb070, 1.0); rimL.position.set(-4, 3, -3); scene.add(rimL);
const fillL = new THREE.DirectionalLight(0xffe8d0, 0.5); fillL.position.set(0, 2, 6); scene.add(fillL);
const fireLight = new THREE.PointLight(0xff7a20, 2.5, 7, 1.6); fireLight.position.set(0, 0.9, 0); scene.add(fireLight);

// ================= helpers =================
const rand = (() => { let s = 23; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
function canvasTex(w, h, fn, color = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); fn(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  if (color) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  t.userData.mimeType = 'image/jpeg';
  return t;
}
function pixelTex(w, h, fn, color = true) {
  return canvasTex(w, h, (ctx) => { const img = ctx.createImageData(w, h); fn(img.data, w, h); ctx.putImageData(img, 0, 0); }, color);
}
function heightToNormal(hArr, w, h, strength) {
  const at = (x, y) => hArr[((y + h) % h) * w + ((x + w) % w)];
  return pixelTex(w, h, (d) => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let nx = -(at(x + 1, y) - at(x - 1, y)) * strength, ny = -(at(x, y - 1) - at(x, y + 1)) * strength;
      const l = Math.hypot(nx, ny, 1), i = (y * w + x) * 4;
      d[i] = (nx / l * 0.5 + 0.5) * 255; d[i + 1] = (ny / l * 0.5 + 0.5) * 255; d[i + 2] = (1 / l * 0.5 + 0.5) * 255; d[i + 3] = 255;
    }
  }, false);
}

// ================= environment =================
const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: 0x4a1610, roughness: 0.7, metalness: 0.1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const rug = new THREE.Mesh(new THREE.RingGeometry(1.4, 1.5, 96), new THREE.MeshBasicMaterial({ color: 0xc8963a }));
rug.rotation.x = -Math.PI / 2; rug.position.y = 0.005; scene.add(rug);
const rug2 = rug.clone(); rug2.scale.setScalar(2.1); scene.add(rug2);

function dotTex() {
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,255,255,.4)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}
const DOT = dotTex();

// ================= textures =================
// feather: u across (0..1), v along length (0 base .. 1 tip); canvas top = tip
const featherHW = (v) => 0.5 * Math.pow(Math.sin(Math.PI * Math.min(0.999, Math.max(0.001, v * 0.96 + 0.02))), 0.55) * smooth(0, 0.12, v);
function featherTextures(orn) {
  const W = 128, H = 512;
  const outline = (g, k) => { g.beginPath(); for (let i = 0; i <= 60; i++) { const v = i / 60; g.lineTo(W / 2 + featherHW(v) * W * k, H - v * H); } for (let i = 60; i >= 0; i--) { const v = i / 60; g.lineTo(W / 2 - featherHW(v) * W * k, H - v * H); } };
  const draw = (em) => (g) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    const gr = g.createLinearGradient(0, H, 0, 0);
    if (em) { gr.addColorStop(0, '#000'); gr.addColorStop(0.55, '#200800'); gr.addColorStop(0.8, '#b04a08'); gr.addColorStop(1, '#ffd060'); }
    else { gr.addColorStop(0, '#6a0810'); gr.addColorStop(0.3, '#c8241a'); gr.addColorStop(0.6, '#f0601c'); gr.addColorStop(0.85, '#ffb03a'); gr.addColorStop(1, '#fff0a0'); }
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    if (!em) { g.strokeStyle = 'rgba(90,10,0,.3)'; g.lineWidth = 1.2; for (let y = 0; y < H; y += 6) { g.beginPath(); g.moveTo(W / 2, y); g.lineTo(0, y - 26); g.moveTo(W / 2, y); g.lineTo(W, y - 26); g.stroke(); } }
    if (orn) {   // paisley "eye" ornament with a starry indigo heart
      const cy = H * 0.5;
      g.fillStyle = '#f6c856'; g.beginPath(); g.ellipse(W / 2, cy, W * 0.3, H * 0.13, 0, 0, TAU); g.fill();
      g.fillStyle = em ? '#000' : '#2a1d6e'; g.beginPath(); g.ellipse(W / 2, cy, W * 0.22, H * 0.1, 0, 0, TAU); g.fill();
      g.fillStyle = em ? '#806020' : '#ffe9a0';
      for (let i = 0; i < 9; i++) { g.beginPath(); g.arc(W / 2 + (rand() - 0.5) * W * 0.3, cy + (rand() - 0.5) * H * 0.15, 1.5 + rand() * 1.5, 0, TAU); g.fill(); }
      g.fillStyle = '#f6c856'; g.beginPath(); g.arc(W / 2, cy + H * 0.02, W * 0.06, 0, TAU); g.fill();
    }
    g.strokeStyle = '#f6c856'; g.lineWidth = 6; outline(g, 0.98); g.stroke();
    g.lineWidth = 3; g.beginPath(); g.moveTo(W / 2, H); g.lineTo(W / 2, H * 0.08); g.stroke();
    // golden dots along the shaft
    g.fillStyle = '#ffe08a'; for (let v = 0.2; v < 0.9; v += 0.11) { g.beginPath(); g.arc(W / 2 + W * 0.16, H - v * H, 2.5, 0, TAU); g.arc(W / 2 - W * 0.16, H - v * H - 20, 2.5, 0, TAU); g.fill(); }
  };
  return { map: canvasTex(W, H, draw(false)), emissive: canvasTex(W, H, draw(true)) };
}
function wispTexture() {   // soft flame tongue with alpha (PNG)
  const W = 128, H = 256;
  const t = canvasTex(W, H, (g) => {
    g.clearRect(0, 0, W, H);
    for (let k = 0; k < 3; k++) {
      const gr = g.createRadialGradient(W / 2, H * 0.78, 4, W / 2, H * 0.6, H * 0.62);
      gr.addColorStop(0, 'rgba(255,250,200,1)'); gr.addColorStop(0.25, 'rgba(255,200,80,.95)'); gr.addColorStop(0.55, 'rgba(255,110,30,.8)'); gr.addColorStop(0.85, 'rgba(220,40,10,.35)'); gr.addColorStop(1, 'rgba(180,20,0,0)');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
    }
  });
  t.userData.mimeType = 'image/png';
  return t;
}
function breastTexture() {   // indigo starry heart with golden swirls
  const S = 256;
  const draw = (em) => (g) => {
    g.fillStyle = em ? '#000' : '#1e1650'; g.fillRect(0, 0, S, S);
    if (!em) { const gr = g.createRadialGradient(S / 2, S / 2, 4, S / 2, S / 2, S * 0.5); gr.addColorStop(0, '#7a5ad0'); gr.addColorStop(0.6, '#3a2a8a'); gr.addColorStop(1, '#a05a20'); g.fillStyle = gr; g.fillRect(0, 0, S, S); }
    for (let i = 0; i < 70; i++) { g.fillStyle = em ? '#c0a060' : (rand() < 0.5 ? '#fff4c0' : '#ffd060'); g.beginPath(); g.arc(rand() * S, rand() * S, 0.6 + rand() * 2, 0, TAU); g.fill(); }
    g.strokeStyle = '#f6c856'; g.lineWidth = 3;
    for (let k = 0; k < 3; k++) { g.beginPath(); for (let a = 0; a < 5.5; a += 0.1) { const r = 8 + a * 9; g.lineTo(S / 2 + Math.cos(a + k * 2.1) * r, S / 2 + Math.sin(a + k * 2.1) * r * 1.2); } g.stroke(); }
    g.lineWidth = 2; for (let k = 0; k < 5; k++) { g.beginPath(); g.moveTo(S / 2, S); g.quadraticCurveTo(S * (0.1 + k * 0.2), S * 0.5, S / 2 + (k - 2) * 20, 0); g.stroke(); }
  };
  return { map: canvasTex(S, S, draw(false)), emissive: canvasTex(S, S, draw(true)) };
}
function eyeTextures() {
  const S = 256;
  const draw = (em) => (g) => {
    g.fillStyle = em ? '#000' : '#d0401a'; g.fillRect(0, 0, S, S);
    const rings = em ? [[0.46, '#f2c45a'], [0.36, '#000'], [0.17, '#f2c45a'], [0.1, '#000']]
                     : [[0.46, '#f2c45a'], [0.4, '#e8541e'], [0.33, '#9a0f14'], [0.22, '#14302c'], [0.17, '#f2c45a'], [0.1, '#3a0a10']];
    for (const [r, c] of rings) { g.fillStyle = c; g.beginPath(); g.ellipse(S / 2, S * 0.58, r * S * 0.9, r * S * 1.15, 0, 0, TAU); g.fill(); }
  };
  return { map: canvasTex(S, S, draw(false)), emissive: canvasTex(S, S, draw(true)) };
}
function scaleField(S, G) {
  const cell = S / G, pts = [];
  for (let i = 0; i < G * G; i++) pts.push([0.15 + rand() * 0.7, 0.15 + rand() * 0.7, rand()]);
  const edge = new Float32Array(S * S), tone = new Float32Array(S * S), dy = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const cx = Math.floor(x / cell), cy = Math.floor(y / cell);
    let d1 = 1e9, d2 = 1e9, id = 0, py = 0;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      const gx = cx + ox, gy = cy + oy, p = pts[((gy + G) % G) * G + ((gx + G) % G)];
      const qy = (gy + p[1]) * cell, d = Math.hypot(x - (gx + p[0]) * cell, (y - qy) * 1.3);
      if (d < d1) { d2 = d1; d1 = d; id = p[2]; py = (y - qy) / cell; } else if (d < d2) d2 = d;
    }
    edge[y * S + x] = Math.min(1, (d2 - d1) / (cell * 0.35)); tone[y * S + x] = id; dy[y * S + x] = py;
  }
  return { edge, tone, dy };
}
function plumageTextures() {   // overlapping small feathers for body/neck
  const S = 512, { edge, tone, dy } = scaleField(S, 16);
  const dark = [150, 22, 16], light = [244, 110, 34], line = [250, 200, 100];
  const map = pixelTex(S, S, (d) => {
    for (let i = 0; i < S * S; i++) {
      const e = smooth(0, 0.3, edge[i]), t = tone[i] * 0.6 + smooth(-0.4, 0.4, dy[i]) * 0.4, n = rand() * 8;
      for (let k = 0; k < 3; k++) d[i * 4 + k] = mix(line[k], mix(dark[k], light[k], t), e) + n;
      d[i * 4 + 3] = 255;
    }
  });
  const em = pixelTex(S, S, (d) => {
    for (let i = 0; i < S * S; i++) { const g = 1 - smooth(0, 0.3, edge[i]); d[i * 4] = 242 * g; d[i * 4 + 1] = 190 * g; d[i * 4 + 2] = 90 * g; d[i * 4 + 3] = 255; }
  });
  const hgt = new Float32Array(S * S); for (let i = 0; i < S * S; i++) hgt[i] = Math.sqrt(edge[i]) * (0.6 + 0.4 * smooth(-0.5, 0.5, dy[i]));
  const normal = heightToNormal(hgt, S, S, 2.0);
  for (const t of [map, normal, em]) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return { map, normal, emissive: em };
}
function bronzeTex() {
  const S = 256;
  return pixelTex(S, S, (d) => {
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const n = (Math.sin(x * 0.2) * Math.sin(y * 0.13) + Math.sin((x - y) * 0.07)) * 0.2 + rand() * 0.2;
      const band = (y % 64 < 4) ? 1 : 0, wave = Math.abs(((y % 64) - 32) - Math.sin(x / S * TAU * 4) * 10) < 2 ? 1 : 0;
      const g = Math.max(band, wave), i = (y * S + x) * 4;
      const base = [88 + n * 60, 52 + n * 40, 30 + n * 20];
      if (rand() < 0.03) { base[0] = 60; base[1] = 110; base[2] = 90; }
      d[i] = mix(base[0], 214, g); d[i + 1] = mix(base[1], 168, g); d[i + 2] = mix(base[2], 80, g); d[i + 3] = 255;
    }
  });
}

// ================= materials =================
const FT = featherTextures(false), FTO = featherTextures(true), EYE = eyeTextures(), PL = plumageTextures(), WISP = wispTexture(), BR = breastTexture();
const glowMats = [];
function glowable(m, base) { m.userData.baseEmissive = base; glowMats.push(m); return m; }
const featherMat = glowable(new THREE.MeshStandardMaterial({ name: 'feather', map: FT.map, emissiveMap: FT.emissive, emissive: 0xffffff, emissiveIntensity: 0.5, roughness: 0.5, metalness: 0.1, side: THREE.DoubleSide }), 0.5);
const featherOrnMat = glowable(new THREE.MeshStandardMaterial({ name: 'feather_orn', map: FTO.map, emissiveMap: FTO.emissive, emissive: 0xffffff, emissiveIntensity: 0.5, roughness: 0.45, metalness: 0.15, side: THREE.DoubleSide }), 0.5);
const wispMat = glowable(new THREE.MeshStandardMaterial({ name: 'wisp', color: 0xffc080, map: WISP, emissiveMap: WISP, emissive: 0xff9a40, emissiveIntensity: 0.75, transparent: true, depthWrite: false, side: THREE.DoubleSide, roughness: 1, metalness: 0 }), 0.75);
const breastMat = glowable(new THREE.MeshStandardMaterial({ name: 'breast', map: BR.map, emissiveMap: BR.emissive, emissive: 0xffffff, emissiveIntensity: 0.8, roughness: 0.3, metalness: 0.2 }), 0.8);
const eyeFeatherMat = glowable(new THREE.MeshStandardMaterial({ name: 'tail_eye', map: EYE.map, emissiveMap: EYE.emissive, emissive: 0xffffff, emissiveIntensity: 0.6, roughness: 0.45, metalness: 0.15, side: THREE.DoubleSide }), 0.6);
function plumageMat(rx, ry) {
  const m = PL.map.clone(), n = PL.normal.clone(), e = PL.emissive.clone();
  for (const t of [m, n, e]) { t.repeat.set(rx, ry); t.needsUpdate = true; }
  const mat = glowable(new THREE.MeshStandardMaterial({ name: 'plumage', map: m, normalMap: n, emissiveMap: e, emissive: 0xffffff, emissiveIntensity: 0.4, roughness: 0.5, metalness: 0.1 }), 0.4);
  mat.userData.tex = PL;
  return mat;
}
const goldMat = new THREE.MeshStandardMaterial({ name: 'gold', color: 0xe0b04a, roughness: 0.28, metalness: 0.75, emissive: 0x3a2000, emissiveIntensity: 1 });
const eyeMat = glowable(new THREE.MeshStandardMaterial({ name: 'zhuque_eye', color: 0xffd060, emissive: 0xffa020, emissiveIntensity: 0.8, roughness: 0.15 }), 0.8);
const pupilMat = new THREE.MeshPhysicalMaterial({ name: 'pupil', color: 0x080404, roughness: 0.05, clearcoat: 1 });
const plumeMats = [0x8e1014, 0xc8261a, 0xe8541e, 0xf08a2a].map((c, i) => glowable(new THREE.MeshStandardMaterial({ name: 'plume' + i, color: c, emissive: c, emissiveIntensity: 0.12, roughness: 0.5, metalness: 0.1 }), 0.12));
const bronzeMap = bronzeTex(); bronzeMap.wrapS = bronzeMap.wrapT = THREE.RepeatWrapping;
const bronzeMat = new THREE.MeshStandardMaterial({ name: 'bronze', map: bronzeMap, roughness: 0.45, metalness: 0.5 });
const flameMats = [[0xc81808, 0.9, 0.7], [0xff6a10, 1.0, 0.8], [0xffc040, 1.2, 0.9]].map(([c, e, o], i) => new THREE.MeshStandardMaterial({ name: 'flame' + i, color: c, emissive: c, emissiveIntensity: e, transparent: true, opacity: o, depthWrite: false, side: THREE.DoubleSide }));

// ================= geometry builders =================
function featherGeo(len, wid, asym = 0) {
  const sh = new THREE.Shape(), N = 24;
  sh.moveTo(0, 0);
  for (let i = 1; i <= N; i++) { const v = i / N; sh.lineTo(featherHW(v) * wid * (1 + asym), v * len); }
  for (let i = N - 1; i >= 1; i--) { const v = i / N; sh.lineTo(-featherHW(v) * wid * (1 - asym), v * len); }
  sh.lineTo(0, 0);
  const g = new THREE.ShapeGeometry(sh, 2);
  const p = g.attributes.position, uv = g.attributes.uv;

// ================= pose engine =================
const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _m = new THREE.Matrix4();
const quatE = (x, y, z, o = 'XYZ') => new THREE.Quaternion().setFromEuler(_e.set(x, y, z, o));
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const REST = { t: 0, look: 0, nod: 0, cry: 0, beak: 0, crest: 0, spread: 0.8, flapPh: 0, flapAmt: 0, display: 0, fly: -1, flame: 0, breath: 0, awake: 0 };

function framer() {
  let refUp = V(0, 1, 0);
  return (from, to) => {
    const dir = to.clone().sub(from).normalize();
    refUp.addScaledVector(dir, -refUp.dot(dir));
    if (refUp.lengthSq() < 1e-6) refUp.set(0, 1, 0).addScaledVector(dir, -dir.y);
    refUp.normalize();

  };
}
function flyPath(p) {   // returns {pos, yaw, bank, lift}
  const H = 1.7, R = 2.3;

  let pos;
  if (p < 0.15) pos = V(0, 0, 0).lerp(circ(0), smooth(0, 0.15, p));
  else if (p < 0.85) pos = circ(((p - 0.15) / 0.7) * TAU);

  return pos;
}

  // --- flight transform of the whole bird ---

  if (st.fly >= 0) {
    const p = st.fly, e = 0.004;

    const a = flyPath(Math.max(0, p - e)), b = flyPath(Math.min(1, p + e));
    const d = b.sub(a); let yaw = Math.atan2(d.x, d.z);

    const circleK = smooth(0.12, 0.2, p) * (1 - smooth(0.8, 0.88, p));
    glideK = circleK;
    if (Math.hypot(d.x, d.z) < 1e-5) yaw = 0;
    yaw *= smooth(0.0, 0.12, p) * (1 - smooth(0.9, 1, p));
    birdQ = quatE(-0.15 * flyK, yaw, -0.35 * circleK, 'YXZ');
  }
  out.push(['Bird', { p: birdPos, q: birdQ }]);
  // --- body breathing / awake rise ---
  const br = Math.sin(TAU * T / 3) * 0.015 * (1 - flyK);
  out.push(['Body', { p: V(0, 1.3 + br + st.awake * 0.05, 0), q: quatE(-0.05 * st.cry - 0.08 * st.awake + 0.25 * flyK, 0, 0), s: V(1 + br, 1 + br, 1 + br) }]);
  for (const l of LEGS) out.push([l.name, { q: quatE(1.1 * flyK, 0, 0) }]);
  // --- wings ---
  const spread = Math.min(1, st.spread + flyK * 0.5 + st.awake * 0.5);
  const fa = Math.min(1.2, st.flapAmt + flyK * (1 - 0.72 * glideK));
  for (const w of WINGS) {

  fireLight.intensity = 2.5 + Math.sin(t * 13) * 0.3 + Math.sin(t * 7.3) * 0.3 + S.flame * 6 + S.awake * 4;
  if (rand() < 0.25 + S.flame) { const a = rand() * TAU, r = 0.45 * rand(); spark(V(Math.cos(a) * r, 0.75, Math.sin(a) * r), V((rand() - 0.5) * 0.2, 0.6 + rand() * 0.8, (rand() - 0.5) * 0.2), EMBER, 1.4, 0); }
  if (S.awake > 0.3 && rand() < 0.8) { const bp = live.Bird.position; spark(V(bp.x + (rand() - 0.5) * 2.6, bp.y + 1 + rand() * 1.2, bp.z + (rand() - 0.5) * 1.6), V(0, 0.8, 0), rand() < 0.5 ? GOLD : EMBER, 1.2, 0); }
  if (S.fly > 0.05 && S.fly < 0.95 && rand() < 0.9) { const w = live.Bird.localToWorld(V(0, 1.2, -0.6)); spark(w, V((rand() - 0.5) * 0.2, -0.1, (rand() - 0.5) * 0.2), rand() < 0.5 ? GOLD : EMBER, 1.5, -0.1); }
  affection = Math.max(0, affection - dt * 0.01); fill.style.width = (affection * 100).toFixed(1) + '%';
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.t += dt; r.m.scale.setScalar(0.6 + r.t * 2.4); r.m.material.opacity = Math.max(0, 0.8 * (1 - r.t / 1.6)); if (r.t > 1.6) { scene.remove(r.m); r.m.material.dispose(); rings.splice(i, 1); } }
  for (let i = 0; i < SPARK_N; i++) { const s = sparks[i]; if (s.life > 0) { s.life -= dt; s.v.y += s.g * dt; sparkPos[i * 3] += s.v.x * dt; sparkPos[i * 3 + 1] += s.v.y * dt; sparkPos[i * 3 + 2] += s.v.z * dt; const f = Math.max(0, s.life / s.max); sparkCol[i * 3] = s.c[0] * f; sparkCol[i * 3 + 1] = s.c[1] * f; sparkCol[i * 3 + 2] = s.c[2] * f; } else sparkCol[i * 3] = sparkCol[i * 3 + 1] = sparkCol[i * 3 + 2] = 0; }
  sparkGeo.attributes.position.needsUpdate = sparkGeo.attributes.color.needsUpdate = true;
  controls.update(); renderer.render(scene, camera);
}
animate();
</script>
