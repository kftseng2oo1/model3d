<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { zipSync } from 'fflate';

// ================= renderer / scene =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1219);
scene.fog = new THREE.Fog(0x0a1219, 8, 20);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 60);
camera.position.set(3.6, 2.6, 4.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.85, 0.2);
controls.enableDamping = true;
controls.minDistance = 2; controls.maxDistance = 11;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0x9fb8d0, 0x1a1408, 0.75));
const moon = new THREE.DirectionalLight(0xdfe8ff, 2.3);
moon.position.set(3, 7, 3);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 20 });
moon.shadow.bias = -0.0005; moon.shadow.normalBias = 0.02;
scene.add(moon);
const warm = new THREE.DirectionalLight(0xffc98a, 0.9);
warm.position.set(-4, 2.5, -2); scene.add(warm);
const front = new THREE.DirectionalLight(0xcfe0ff, 0.5);
front.position.set(0, 2, 6); scene.add(front);
const glowLight = new THREE.PointLight(0x58e0d0, 0, 6, 1.5);
glowLight.position.set(0, 1.2, 0.3); scene.add(glowLight);

// ================= helpers =================
const rand = (() => { let s = 11; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;
const hexRGB = (h) => [(h >> 16) & 255, (h >> 8) & 255, h & 255];
function canvasTex(w, h, fn, color = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); const img = ctx.createImageData(w, h);
  fn(img.data, w, h); ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  if (color) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  t.userData.mimeType = 'image/jpeg';   // smaller GLB
  return t;
}
function heightToNormal(hArr, w, h, strength) {
  const at = (x, y) => hArr[((y + h) % h) * w + ((x + w) % w)];
  return canvasTex(w, h, (d) => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let nx = -(at(x + 1, y) - at(x - 1, y)) * strength, ny = -(at(x, y - 1) - at(x, y + 1)) * strength, nz = 1;
      const l = Math.hypot(nx, ny, nz); const i = (y * w + x) * 4;
      d[i] = (nx / l * 0.5 + 0.5) * 255; d[i + 1] = (ny / l * 0.5 + 0.5) * 255; d[i + 2] = (nz / l * 0.5 + 0.5) * 255; d[i + 3] = 255;
    }
  }, false);
}

// ================= environment: stone altar over dark water =================
function stoneTex() {
  const S = 512;
  return canvasTex(S, S, (d) => {
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const n = (Math.sin(x * 0.05) * Math.sin(y * 0.07) + Math.sin((x + y) * 0.13)) * 0.15 + rand() * 0.25;
      const r = Math.hypot(x - S / 2, y - S / 2) / (S / 2);
      const ring = (Math.abs(r - 0.93) < 0.008 || Math.abs(r - 0.86) < 0.006 || Math.abs(r - 0.42) < 0.006) ? 0.6 : 1;
      const v = (58 + n * 40) * ring, i = (y * S + x) * 4;
      d[i] = v * 0.95; d[i + 1] = v; d[i + 2] = v * 1.02; d[i + 3] = 255;
    }
  });
}
const altarMat = new THREE.MeshStandardMaterial({ map: stoneTex(), roughness: 0.9 });
const altar = new THREE.Mesh(new THREE.CylinderGeometry(3.0, 3.15, 0.3, 96), [
  new THREE.MeshStandardMaterial({ color: 0x3a3c3e, roughness: 0.9 }), altarMat, altarMat]);
altar.position.y = -0.15; altar.receiveShadow = true; altar.castShadow = true;
// CylinderGeometry groups: 0 side, 1 top, 2 bottom
scene.add(altar);
const water = new THREE.Mesh(new THREE.CircleGeometry(30, 64),
  new THREE.MeshStandardMaterial({ color: 0x0c2630, roughness: 0.12, metalness: 0.6 }));
water.rotation.x = -Math.PI / 2; water.position.y = -0.22; water.receiveShadow = true;
scene.add(water);

// mist motes
const MOTES = 220;
const moteGeo = new THREE.BufferGeometry();
const moteArr = new Float32Array(MOTES * 3), moteSeed = [];
for (let i = 0; i < MOTES; i++) { const a = rand() * Math.PI * 2, r = 2 + rand() * 7; moteArr.set([Math.cos(a) * r, rand() * 3, Math.sin(a) * r], i * 3); moteSeed.push(rand() * 10); }
moteGeo.setAttribute('position', new THREE.BufferAttribute(moteArr, 3));
function dotTex() {
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,255,255,.4)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}
const DOT = dotTex();
scene.add(new THREE.Points(moteGeo, new THREE.PointsMaterial({ size: 0.05, map: DOT, color: 0x7fb6c4, transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending })));

// ================= textures for the beast =================
function scaleField(S, G, seed) {
  const cell = S / G, pts = [];
  for (let i = 0; i < G * G; i++) pts.push([0.15 + rand() * 0.7, 0.15 + rand() * 0.7, rand()]);
  const edge = new Float32Array(S * S), tone = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const cx = Math.floor(x / cell), cy = Math.floor(y / cell);
    let d1 = 1e9, d2 = 1e9, id = 0;
    for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
      const gx = cx + ox, gy = cy + oy, p = pts[((gy + G) % G) * G + ((gx + G) % G)];
      const d = Math.hypot(x - (gx + p[0]) * cell, y - (gy + p[1]) * cell);
      if (d < d1) { d2 = d1; d1 = d; id = p[2]; } else if (d < d2) d2 = d;
    }
    edge[y * S + x] = Math.min(1, (d2 - d1) / (cell * 0.35)); tone[y * S + x] = id;
  }
  return { edge, tone };
}
function scaleTextures(G, dark, light, line) {
  const S = 512, { edge, tone } = scaleField(S, G);
  const map = canvasTex(S, S, (d) => {
    for (let i = 0; i < S * S; i++) {
      const e = smooth(0, 0.35, edge[i]), t = tone[i], n = rand() * 8, hi = 0.85 + 0.3 * edge[i];
      for (let k = 0; k < 3; k++) d[i * 4 + k] = mix(line[k], mix(dark[k], light[k], t) * hi, e) + n;
      d[i * 4 + 3] = 255;
    }
  });
  const hgt = new Float32Array(S * S); for (let i = 0; i < S * S; i++) hgt[i] = Math.sqrt(edge[i]);
  const normal = heightToNormal(hgt, S, S, 2.2);
  for (const t of [map, normal]) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return { map, normal };
}
const skinTex = scaleTextures(14, [44, 58, 56], [70, 86, 78], [14, 18, 18]);
const snakeTex = scaleTextures(10, [24, 40, 34], [52, 74, 58], [190, 150, 70]);
function scaleMat(tex, rx, ry, extra = {}) {
  const m = tex.map.clone(), n = tex.normal.clone();
  m.repeat.set(rx, ry); n.repeat.set(rx, ry); m.needsUpdate = n.needsUpdate = true;
  const mat = new THREE.MeshStandardMaterial(Object.assign({ map: m, normalMap: n, roughness: 0.6, metalness: 0.15 }, extra));
  mat.userData.tex = tex;
  return mat;
}

// ================= carapace =================
const SX = 1.0, SY = 0.86, SZ = 1.28, TH = Math.PI * 0.55, SHELL_Y = 0.54;
const D2R = Math.PI / 180;
const dirV = (thDeg, azDeg) => { const t = thDeg * D2R, a = azDeg * D2R; return new THREE.Vector3(Math.sin(a) * Math.sin(t) * SX, Math.cos(t) * SY, Math.cos(a) * Math.sin(t) * SZ); };
const centers = [];
[[60, 0], [30, 0], [0, 0], [30, 180], [58, 180]].forEach(([t, a]) => centers.push(dirV(t, a)));
[40, 74, 108, 142].forEach(a => { centers.push(dirV(56, a)); centers.push(dirV(56, -a)); });
for (let k = 0; k < 24; k++) centers.push(dirV(90, 7.5 + k * 15));
const CN = centers.map(v => [v.x, v.y, v.z]);
function scuteInfo(x, y, z) {
  let d1 = 1e9, d2 = 1e9, idx = 0;
  for (let i = 0; i < CN.length; i++) { const c = CN[i], d = (x - c[0]) ** 2 + (y - c[1]) ** 2 + (z - c[2]) ** 2; if (d < d1) { d2 = d1; d1 = d; idx = i; } else if (d < d2) d2 = d; }
  d1 = Math.sqrt(d1); d2 = Math.sqrt(d2); const border = (d2 - d1) * 0.5;
  return { t: border / (border + d1 + 1e-6), idx };
}
function shellPoint(u, v) { const phi = u * Math.PI * 2, th = v * TH; return [-Math.cos(phi) * Math.sin(th) * SX, Math.cos(th) * SY, Math.sin(phi) * Math.sin(th) * SZ, th]; }
function shellDeform(x, y, z, th, t) {
  let r = 1 - 0.028 * (1 - smooth(0, 0.09, t)) + 0.014 * smooth(0.6, 0.85, t);
  r += 0.07 * smooth(70 * D2R, 100 * D2R, th);
  const yy = y * (1 - 0.08 * smooth(0, 0.6, y / SY)) + (z < 0 ? -z * 0.04 : 0);
  return [x * r, yy * (th > 1.3 ? 1 : r), z * r];
}
const GOLD = hexRGB(0xd4ac5a);
function shellTextures() {
  const W = 1024, H = 448;
  const hgt = new Float32Array(W * H);
  const emis = new Uint8ClampedArray(W * H * 4);
  const map = canvasTex(W, H, (d) => {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const [px, py, pz, th] = shellPoint(x / W, y / H);
      const { t, idx } = scuteInfo(px, py, pz);
      const n = (Math.sin(x * 0.37 + y * 0.11) * Math.sin(x * 0.07 - y * 0.29)) * 0.5 + 0.5;
      const patina = rand() < 0.04 ? 1 : 0;
      let col = [mix(14, 30, n), mix(28, 50, n), mix(28, 46, n)];
      if (patina) col = [46, 104, 92];
      let h = 0.35 + 0.5 * smooth(0.0, 0.7, t) + 0.15 * smooth(0.78, 0.86, t);
      if (t > 0.86) col = col.map(v => v * 1.25 + 6);              // raised boss
      // engraved golden lines: seam, two growth rings, boss ring
      const line = (c, w) => 1 - smooth(w * 0.5, w, Math.abs(t - c));
      const g = Math.max(line(0.012, 0.03), line(0.33, 0.022), line(0.58, 0.018), line(0.84, 0.02));
      const groove = smooth(0.03, 0.065, t);
      col = col.map(v => v * (0.45 + 0.55 * groove));
      col = col.map((v, k) => mix(v, GOLD[k], g * 0.95));
      h -= g * 0.18;
      const i4 = (y * W + x) * 4;
      d[i4] = col[0]; d[i4 + 1] = col[1]; d[i4 + 2] = col[2]; d[i4 + 3] = 255;
      emis[i4] = GOLD[0] * g; emis[i4 + 1] = GOLD[1] * g; emis[i4 + 2] = GOLD[2] * g * 0.8; emis[i4 + 3] = 255;
      hgt[y * W + x] = h * (0.3 + 0.7 * groove);
    }
  });
  const emissive = canvasTex(W, H, (d) => d.set(emis));
  const normal = heightToNormal(hgt, W, H, 3.0);
  normal.wrapS = map.wrapS = emissive.wrapS = THREE.RepeatWrapping;
  return { map, normal, emissive };
}

// ================= assemble beast =================
const beast = new THREE.Group(); beast.name = 'Xuanwu';
scene.add(beast);
const body = new THREE.Group(); body.name = 'Body';
beast.add(body);
const parts = {};      // name -> node (live)
let shellMat, eyeMats = [];
const legs = [];
const LEG_DEFS = [['Leg_Front_L', true, 1], ['Leg_Front_R', true, -1], ['Leg_Back_L', false, 1], ['Leg_Back_R', false, -1]];
const baseZ = (front, side) => side * (front ? 0.28 : 0.2);
const NECK = [0, SHELL_Y - 0.04, 1.0];

function tag(obj, part) { obj.traverse(o => { o.userData.part = part; }); }

function buildShellGeo(ws, hs) {
  const geo = new THREE.SphereGeometry(1, ws, hs, 0, Math.PI * 2, 0, TH);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const [x, y, z, th] = shellPoint(uv.getX(i), 1 - uv.getY(i));
    const { t } = scuteInfo(x, y, z);
    pos.setXYZ(i, ...shellDeform(x, y, z, th, t));
  }
  geo.computeVertexNormals();
  return geo;
}
function buildShell() {
  const geo = buildShellGeo(320, 140);
  const tex = shellTextures();
  shellMat = new THREE.MeshStandardMaterial({ name: 'carapace', map: tex.map, normalMap: tex.normal, emissiveMap: tex.emissive, emissive: 0xffffff, emissiveIntensity: 0.35, roughness: 0.38, metalness: 0.35, side: THREE.DoubleSide });
  const m = new THREE.Mesh(geo, shellMat);
  m.name = 'Carapace'; m.position.y = SHELL_Y; m.castShadow = m.receiveShadow = true;
  tag(m, 'shell'); body.add(m);
  const plast = new THREE.Mesh(new THREE.CylinderGeometry(1, 0.96, 0.1, 64), new THREE.MeshStandardMaterial({ name: 'plastron', color: 0x3b3a2c, roughness: 0.6, metalness: 0.3 }));
  plast.name = 'Plastron'; plast.scale.set(0.9, 1, 1.18); plast.position.y = SHELL_Y - 0.12; plast.castShadow = true;
  tag(plast, 'shell'); body.add(plast);
  const inner = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 24), new THREE.MeshStandardMaterial({ name: 'inner', color: 0x1c2222, roughness: 0.9 }));
  inner.name = 'InnerBody'; inner.scale.set(0.95, 0.35, 1.22); inner.position.y = SHELL_Y - 0.02; tag(inner, 'shell'); body.add(inner);
}

const clawMat = new THREE.MeshStandardMaterial({ name: 'claw', color: 0xc9a65c, roughness: 0.3, metalness: 0.6 });
function buildLegs() {
  for (const [name, front, side] of LEG_DEFS) {
    const pivot = new THREE.Group(); pivot.name = name;
    const len = SHELL_Y + 0.02, r1 = front ? 0.2 : 0.21, r2 = front ? 0.16 : 0.19;
    const g = new THREE.CylinderGeometry(r1, r2, len, 32, 8); g.translate(0, -len / 2, 0);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) { const k = 1 + 0.12 * Math.sin((-p.getY(i) / len) * Math.PI); p.setX(i, p.getX(i) * k); p.setZ(i, p.getZ(i) * (front ? k * 1.1 : k)); }
    g.computeVertexNormals();
    const leg = new THREE.Mesh(g, scaleMat(skinTex, 2.4, 2)); leg.castShadow = true; pivot.add(leg);
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.2, 32, 16), scaleMat(skinTex, 2, 2));
    foot.scale.set(1.05, 0.45, front ? 1.05 : 0.95); foot.position.set(0, -len + 0.04, front ? 0.04 : 0); foot.castShadow = true; pivot.add(foot);
    const n = front ? 5 : 4;
    for (let i = 0; i < n; i++) {
      const a = (i / (n - 1) - 0.5) * (front ? 1.5 : 1.2);
      const claw = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.12, 12), clawMat);
      claw.position.set(Math.sin(a) * 0.19, -len + 0.03, Math.cos(a) * 0.17 + (front ? 0.04 : 0));
      claw.rotation.order = 'YXZ'; claw.rotation.set(Math.PI / 2 + 0.4, a, 0); claw.castShadow = true; pivot.add(claw);
    }
    pivot.position.set(side * 0.6, SHELL_Y, front ? 0.7 : -0.7);
    pivot.rotation.z = baseZ(front, side);
    tag(pivot, 'leg'); body.add(pivot); legs.push(pivot);
  }
}

function makeEye(mat, r) {
  const g = new THREE.Group();
  const ball = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), mat); g.add(ball);
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(r * 0.55, 16, 12), new THREE.MeshPhysicalMaterial({ name: 'pupil', color: 0x050505, roughness: 0.05, clearcoat: 1 }));
  pupil.scale.set(0.45, 1, 1); pupil.position.z = r * 0.55; g.add(pupil);
  return g;
}
function buildTortoiseHead() {
  const neck = new THREE.Group(); neck.name = 'Neck'; neck.position.set(...NECK); body.add(neck);
  const nGeo = new THREE.CylinderGeometry(0.15, 0.21, 0.75, 32, 12, true); nGeo.rotateX(Math.PI / 2);
  const np = nGeo.attributes.position;
  for (let i = 0; i < np.count; i++) { const k = 1 + 0.05 * Math.sin(np.getZ(i) * 40); np.setX(i, np.getX(i) * k); np.setY(i, np.getY(i) * k); }

const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _m = new THREE.Matrix4();

// returns [[name, {p, q, s}], ...]
function computePose(st) {

  const pts = [];

function buildClips() {

        const id = node + key; (tracks[id] ||= { node, key, times: [], vals: [] });
        tracks[id].times.push(t); tracks[id].vals.push(...tr[key].toArray());
      }
    }
    const out = [];

      const w = tr.key === 'q' ? 4 : 3, v = tr.vals;
      let varies = false; for (let i = w; i < v.length && !varies; i++) if (Math.abs(v[i] - v[i % w]) > 1e-4) varies = true;

    bake('Walk', 3.2, (t, k) => ({ snakeT: t, walkAmt: 1, walkPhase: k * Math.PI * 4, nod: Math.sin(k * Math.PI * 8) * 0.04 })),
    bake('Retract', 1.0, (t, k) => ({ hide: ease(k), close: ease(Math.min(1, k * 2)) })),
    bake('SnakeRear', 1.2, (t, k) => { const r = Math.sin(Math.min(1, k / 0.75) * Math.PI); return { rear: r, jaw: r * smooth(0.15, 0.4, k), tongue: pulse(k, 0.55, 0.3), snakeT: 0 }; }),
    bake('Blink', 0.25, (t, k) => ({ close: Math.sin(k * Math.PI) })),
    bake('Awaken', 3.2, (t, k) => { const a = Math.sin(Math.min(1, k / 0.9) * Math.PI); return { awake: a, snakeT: t, jaw: a * 0.4, tongue: pulse(k, 0.3, 0.12) }; }),
  ];
}

// ================= GLB export =================
function buildExportScene() {
  const clone = beast.clone(true);
  clone.position.set(0, 0, 0); clone.rotation.set(0, 0, 0);
  applyPose(nodeMapOf(clone), REST);
  const geoCache = new Map();
  clone.traverse(o => {
    if (!o.isMesh) return;
    const m0 = o.material;
    if (m0.userData.tex) {
      const rep = m0.map.repeat, key = o.geometry.uuid + rep.x + 'x' + rep.y;
      if (!geoCache.has(key)) { const g = o.geometry.clone(), uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * rep.x, uv.getY(i) * rep.y); geoCache.set(key, g); }
      o.geometry = geoCache.get(key);
      const k = m0.userData.tex === skinTex ? 'skin' : 'snake';
      o.material = exportMats[k] ||= Object.assign(m0.clone(), { map: m0.userData.tex.map, normalMap: m0.userData.tex.normal, name: k });
    }
    if (o.name === 'Carapace') o.geometry = buildShellGeo(192, 84);
    if (m0 === shellMat) { o.material = exportMats.shell ||= Object.assign(m0.clone(), { emissiveIntensity: 0.35 }); }
  });
  const s = new THREE.Scene(); s.add(clone); return s;
}
const exportMats = {};
function exportGLB() {
  return new Promise((res, rej) => new GLTFExporter().parse(buildExportScene(), res, rej, { binary: true, maxTextureSize: 1024, animations: buildClips() }));
}
window.__exportGLB = async () => {
  const u = new Uint8Array(await exportGLB()); let bin = '';
  for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(bin);
};
let dl = null;
try { if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { dl = d; }).catch(() => {}); } catch (e) {}
document.getElementById('bExport').onclick = async () => {
  toast('正在產生模型…', true);
  try {
    const buf = await exportGLB();
    if (dl) {
      const zip = zipSync({ 'xuanwu.glb': [new Uint8Array(buf), { level: 0 }] });
      try { await dl.save({ filename: 'xuanwu-glb.zip', data: zip }); toast('已下載 xuanwu-glb.zip，解壓後即是 xuanwu.glb', true); }
      catch (e) { toast(e && e.code === 'declined' ? '已取消下載' : '這裡無法下載：' + (e && e.code || ''), true); }
    } else if (window.claude) toast('此預覽畫面不支援下載', true);
    else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' }));
      a.download = 'xuanwu.glb'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast('已下載 xuanwu.glb', true);
    }
  } catch (e) { toast('匯出失敗：' + e.message, true); }
};

// ================= loop =================
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (snake.head) {
    S.snakeT += dt * (rearT >= 0 ? 1.8 : 1);
    // walking
    if (walking) { S.walkPhase += dt * 3.9; beast.rotation.y += dt * 0.25; walkTimer -= dt; if (walkTimer <= 0) stopWalk(); }
    S.walkAmt += ((walking ? 1 : 0) - S.walkAmt) * Math.min(1, dt * 6);
    // tortoise head retract (in, hold, out)
    if (retractT >= 0) { retractT += dt; S.hide = retractT < 0.5 ? smooth(0, 0.5, retractT) : retractT < 1.7 ? 1 : 1 - smooth(1.7, 2.3, retractT); if (retractT > 2.3) { retractT = -1; S.hide = 0; } }
    // snake rear + hiss
    if (rearT >= 0) { rearT += dt; const k = rearT / 1.2; S.rear = Math.sin(Math.min(1, k / 0.75) * Math.PI); S.jaw = S.rear * smooth(0.15, 0.4, k); if (k >= 1) { rearT = -1; S.rear = S.jaw = 0; } }
    // tongue flicks
    if (t > nextTongue) { tongueT = 0; nextTongue = t + 3 + Math.random() * 4; }
    if (tongueT >= 0) { tongueT += dt; S.tongue = Math.max(Math.sin(Math.min(1, tongueT / 0.3) * Math.PI), Math.sin(Math.min(1, Math.max(0, tongueT - 0.35) / 0.3) * Math.PI)); if (tongueT > 0.7) { tongueT = -1; S.tongue = 0; } }
    // awaken
    if (awakeT >= 0) {
      awakeT += dt; const k = awakeT / 3.2; S.awake = Math.sin(Math.min(1, k / 0.9) * Math.PI); S.jaw = Math.max(S.jaw, S.awake * 0.4);
      glow = Math.max(glow, 1 + 3 * S.awake);
      if (rand() < 0.7) { const a = t * 6 + rand(), r = 1.4 + rand() * 0.4; spark(new THREE.Vector3(beast.position.x + Math.cos(a) * r, 0.05, beast.position.z + Math.sin(a) * r), new THREE.Vector3(-Math.sin(a) * 0.6, 1.2 + rand(), Math.cos(a) * 0.6), rand() < 0.5 ? GOLDC : CYAN, 1.8); }
      if (k >= 1) { awakeT = -1; S.awake = 0; }
    }
    // idle look / blink / happy (eyes close softly while petted)
    S.look = walking ? 0 : Math.sin(t * 0.5) * 0.4;
    S.nod = Math.sin(t * 0.8) * 0.05 + (walking ? Math.sin(S.walkPhase * 2) * 0.04 : 0);
    if (t > nextBlink) { blinkT = 0; nextBlink = t + 2.5 + Math.random() * 3; }
    let close = Math.max(S.hide, happyT > 0 ? 0.75 : 0);
    if (blinkT >= 0) { blinkT += dt; close = Math.max(close, Math.sin(Math.min(1, blinkT / 0.22) * Math.PI)); if (blinkT > 0.22) blinkT = -1; }
    S.close += (close - S.close) * Math.min(1, dt * 14);
    happyT = Math.max(0, happyT - dt);
    applyPose(live, S);
    // glow
    glow = Math.max(0, glow - dt * 1.4);
    shellMat.emissiveIntensity = 0.35 + glow * 1.1 + Math.sin(t * 1.5) * 0.08;
    glowLight.intensity = glow * 3;
    eyeMats.forEach(m => m.emissiveIntensity = 0.6 + glow * 0.8);
    affection = Math.max(0, affection - dt * 0.01);
    fill.style.width = (affection * 100).toFixed(1) + '%';
  }
  // ripples
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.life += dt; r.m.scale.setScalar(0.3 + r.life * 2.2); r.m.material.opacity = Math.max(0, 0.8 * (1 - r.life / 1.6));
    if (r.life > 1.6) { scene.remove(r.m); r.m.material.dispose(); ripples.splice(i, 1); }
  }
  // sparks
  for (let i = 0; i < SPARK_N; i++) {
    const s = sparks[i];
    if (s.life > 0) {
      s.life -= dt; s.v.y -= dt * 0.3;
      sparkPos[i * 3] += s.v.x * dt; sparkPos[i * 3 + 1] += s.v.y * dt; sparkPos[i * 3 + 2] += s.v.z * dt;
      const f = Math.max(0, s.life / s.max); sparkCol[i * 3] = s.c[0] * f; sparkCol[i * 3 + 1] = s.c[1] * f; sparkCol[i * 3 + 2] = s.c[2] * f;
    } else { sparkCol[i * 3] = sparkCol[i * 3 + 1] = sparkCol[i * 3 + 2] = 0; }
  }
  sparkGeo.attributes.position.needsUpdate = sparkGeo.attributes.color.needsUpdate = true;
  // motes drift
  for (let i = 0; i < MOTES; i++) { moteArr[i * 3 + 1] += Math.sin(t * 0.3 + moteSeed[i]) * 0.002; }
  moteGeo.attributes.position.needsUpdate = true;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
