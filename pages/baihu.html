  canvas{display:block}
  #title{position:fixed;top:14px;left:16px;pointer-events:none}

  #toast.show{opacity:1}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;letter-spacing:4px;color:#f2f6ff}

const key = new THREE.DirectionalLight(0xfff6ea, 2.3); key.position.set(3, 7, 5); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);

const rand = (() => { let s = 51; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: 0x1a2030, roughness: 0.7, metalness: 0.15 }));

// ===== textures =====
function brush(g, pts, w0, w1) {   // tapered ink stroke along points

function furTextures(kind) {   // kind: 'body' (vertical stripes, white belly) | 'leg' (horizontal bands) | 'head'

{

function onHead() { if (play('roar')) { roarSound(); glow = Math.max(glow, 1.2); ring(0xbfd8ff, PED_TOP + 0.02); setTimeout(() => ring(0xf2d48a, PED_TOP + 0.02), 200); } }
function onPaw() { if (play('swipe')) { setTimeout(() => { slashSound(); clawSlash(); }, 520); } }
function onTail() { if (play('lash')) { lashSound(); const p = live.Tail_13.getWorldPosition(V(0, 0, 0)); for (let i = 0; i < 25; i++) spark(p, V((rand() - 0.5) * 1.2, rand() * 0.8, (rand() - 0.5) * 1.2), GOLD, 0.8); } }
function onBody() { if (play('stand')) { glow = Math.max(glow, 2); tone(587, 1.2, 0.05); tone(880, 1.4, 0.04, 'sine', 0.2); } }
function onAltar() { bellSound(); glow = Math.max(glow, 2.2); ring(0xf2d48a); setTimeout(() => ring(0xbfd8ff), 250); for (let i = 0; i < 50; i++) { const a = rand() * TAU, r = 0.6 + rand() * 0.3; spark(V(Math.cos(a) * r, 0.4, Math.sin(a) * r), V(0, 0.8 + rand() * 0.8, 0), rand() < 0.5 ? GOLD : SILVER, 1.4); } }
function run() { if (busy()) return; play('run'); }
function awaken() { if (busy()) return; affection = 0; shangChord(); roarSound(); toast('白虎護佑・西方庚金'); for (let k = 0; k < 6; k++) setTimeout(() => ring(k % 2 ? 0xf2d48a : 0xbfd8ff), k * 220); play('awake', () => play('run')); }

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hit(e) { ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); const hs = ray.intersectObject(root, true); const h = hs.find(x => x.object.material !== wispMat) || hs[0]; return h ? { part: h.object.userData.part, point: h.point } : null; }
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { audio(); const h = hit(e); if (h) { controls.enabled = false; down = { lx: e.clientX, ly: e.clientY, part: h.part, point: h.point, moved: 0 }; } });
addEventListener('pointermove', (e) => { if (!down) return; const d = Math.hypot(e.clientX - down.lx, e.clientY - down.ly); down.lx = e.clientX; down.ly = e.clientY; down.moved += d;
  if (down.moved > 10) { const h = hit(e); if (h) { affection = Math.min(1, affection + d / 2600); happyT = 0.6; glow = Math.max(glow, 0.9); petStroke += d;
    if (rand() < 0.5) spark(h.point, V((rand() - 0.5) * 0.3, 0.3 + rand() * 0.4, (rand() - 0.5) * 0.3), rand() < 0.5 ? GOLD : SILVER, 1);
    if (petStroke > 380) { petStroke = 0; tone([587, 659, 740, 880, 988][Math.floor(rand() * 5)], 0.6, 0.05); }
    if (affection >= 1) awaken(); } } });
addEventListener('pointerup', () => { if (down && down.moved < 10 && !busy()) { hintEl.style.opacity = 0; ({ head: onHead, paw: onPaw, tail: onTail, body: onBody, altar: onAltar }[down.part] || onBody)(); affection = Math.min(1, affection + 0.06); if (affection >= 1) awaken(); } down = null; controls.enabled = true; });
document.getElementById('bRun').onclick = () => { audio(); run(); };
document.getElementById('bAwake').onclick = () => { audio(); awaken(); };
const bSpin = document.getElementById('bSpin'); bSpin.onclick = () => { controls.autoRotate = !controls.autoRotate; controls.autoRotateSpeed = 1.0; bSpin.classList.toggle('on', controls.autoRotate); };
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ===== GLB =====
function buildClips() {
  const FPS = 15;
  function bake(name, dur, stFn) { const n = Math.round(dur * FPS), tracks = {};
    for (let i = 0; i <= n; i++) { const t = i / FPS, st = Object.assign({}, REST, { t }, stFn(t / dur));
      for (const [node, tr] of computePose(st)) for (const key of ['p', 'q', 's']) if (tr[key]) { const id = node + key; (tracks[id] ||= { node, key, times: [], vals: [] }); tracks[id].times.push(t); tracks[id].vals.push(...tr[key].toArray()); } }
    const out = []; for (const tr of Object.values(tracks)) { const w = tr.key === 'q' ? 4 : 3, v = tr.vals; let varies = false; for (let i = w; i < v.length && !varies; i++) if (Math.abs(v[i] - v[i % w]) > 1e-4) varies = true; if (!varies) continue;
      out.push(tr.key === 'q' ? new THREE.QuaternionKeyframeTrack(tr.node + '.quaternion', tr.times, v) : new THREE.VectorKeyframeTrack(tr.node + (tr.key === 'p' ? '.position' : '.scale'), tr.times, v)); }
    return new THREE.AnimationClip(name, dur, out); }
  return [bake('Idle', 4.8, () => ({ look: 0 })), bake('Roar', ...CLIPS.roar), bake('Swipe', ...CLIPS.swipe), bake('TailLash', ...CLIPS.lash), bake('Stand', ...CLIPS.stand), bake('Run', ...CLIPS.run), bake('Awaken', ...CLIPS.awake)];
}
function buildExportScene() { const clone = root.clone(true); applyPose(nodeMapOf(clone), REST); const mc = new Map();
  clone.traverse(o => { if (!o.isMesh || Array.isArray(o.material)) return; const m0 = o.material; if (m0.userData.baseEmissive !== undefined) { if (!mc.has(m0.uuid)) { const m = m0.clone(); m.emissiveIntensity = m0.userData.baseEmissive; mc.set(m0.uuid, m); } o.material = mc.get(m0.uuid); } });
  const s = new THREE.Scene(); s.add(clone); return s; }
function exportGLB() { return new Promise((res, rej) => new GLTFExporter().parse(buildExportScene(), res, rej, { binary: true, maxTextureSize: 1024, animations: buildClips() })); }
window.__exportGLB = async () => { const u = new Uint8Array(await exportGLB()); let bin = ''; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(bin); };
window.__tap = (p) => ({ head: onHead, paw: onPaw, tail: onTail, body: onBody, altar: onAltar })[p](); window.__awaken = awaken; window.__run = run; window.__cam = (x,y,z,tx,ty,tz) => { camera.position.set(x,y,z); controls.target.set(tx,ty,tz); };
let dl = null; try { if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { dl = d; }).catch(() => {}); } catch (e) {}
document.getElementById('bExport').onclick = async () => { toast('正在產生模型…', true);
  try { const buf = await exportGLB();
    if (dl) { const zip = zipSync({ 'tiger.glb': [new Uint8Array(buf), { level: 0 }] }); try { await dl.save({ filename: 'tiger-glb.zip', data: zip }); toast('已下載 tiger-glb.zip，解壓後即是 tiger.glb', true); } catch (e) { toast(e && e.code === 'declined' ? '已取消下載' : '這裡無法下載：' + (e && e.code || ''), true); } }
    else if (window.claude) toast('此預覽畫面不支援下載', true);
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' })); a.download = 'tiger.glb'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast('已下載 tiger.glb', true); }
  } catch (e) { toast('匯出失敗：' + e.message, true); } };

// ===== loop =====
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  Object.assign(S, REST, { t }); S.look = Math.sin(t * 0.35) * 0.35;
  for (let i = acts.length - 1; i >= 0; i--) { const a = acts[i]; a.t += dt; const k = Math.min(1, a.t / a.dur); a.fn(k, S); if (k >= 1) { acts.splice(i, 1); if (a.end) a.end(); } }
  if (happyT > 0) { S.purr = 1; happyT -= dt; }
  applyPose(live, S);
  glow = Math.max(0, glow - dt * 1.3); const g = glow + S.awake * 2.5;
  for (const m of glowMats) m.emissiveIntensity = m.userData.baseEmissive * (1 + Math.min(g, 2.5) * (m === wispMat ? 0.4 : (m === starMat || m === starLineMat ? 1.6 : 0.6)));
  glowLight.intensity = g * 2.5; glowLight.position.copy(live.Head.getWorldPosition(V(0, 0, 0))).add(V(0, 0, 0.6));
  if (S.awake > 0.3 && rand() < 0.7) { const p = live.Spine.getWorldPosition(V(0, 0, 0)); spark(p.add(V((rand() - 0.5) * 1.2, rand() * 0.8, (rand() - 0.5) * 1.2)), V(0, 0.5, 0), rand() < 0.5 ? GOLD : ICE, 1.2); }
  if (S.run > 0.1 && S.run < 0.9 && rand() < 0.7) spark(live.Hips.getWorldPosition(V(0, 0, 0)), V(0, 0.2, 0), rand() < 0.5 ? GOLD : SILVER, 1.0);
  affection = Math.max(0, affection - dt * 0.01); fill.style.width = (affection * 100).toFixed(1) + '%';
  for (let i = rings.length - 1; i >= 0; i--) { const r = rings[i]; r.t += dt; r.m.scale.setScalar(0.8 + r.t * 2.6); r.m.material.opacity = Math.max(0, 0.85 * (1 - r.t / 1.6)); if (r.t > 1.6) { scene.remove(r.m); r.m.material.dispose(); rings.splice(i, 1); } }
  for (let i = slashes.length - 1; i >= 0; i--) { const s = slashes[i]; s.t += dt; s.l.material.opacity = Math.max(0, 1 - s.t / 0.6); if (s.t > 0.6) { scene.remove(s.l); s.l.geometry.dispose(); s.l.material.dispose(); slashes.splice(i, 1); } }
  for (let i = 0; i < SPARK_N; i++) { const s = sparks[i]; if (s.life > 0) { s.life -= dt; s.v.y += s.g * dt; sparkPos[i * 3] += s.v.x * dt; sparkPos[i * 3 + 1] += s.v.y * dt; sparkPos[i * 3 + 2] += s.v.z * dt; const f = Math.max(0, s.life / s.max); sparkCol[i * 3] = s.c[0] * f; sparkCol[i * 3 + 1] = s.c[1] * f; sparkCol[i * 3 + 2] = s.c[2] * f; } else sparkCol[i * 3] = sparkCol[i * 3 + 1] = sparkCol[i * 3 + 2] = 0; }
  sparkGeo.attributes.position.needsUpdate = sparkGeo.attributes.color.needsUpdate = true;
  controls.update(); renderer.render(scene, camera);
}
animate();
